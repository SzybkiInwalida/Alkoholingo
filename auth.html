<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logowanie / Rejestracja</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f5efe6;
      --card-bg:  #fdf8f2;
      --border:   #6b3d1e;
      --accent:   #7c3a0e;
      --accent2:  #a04a14;
      --text:     #2c1a0e;
      --muted:    #8a6a54;
      --error:    #b91c1c;
      --success:  #166534;
      --input-bg: #fff9f2;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Source Sans 3', sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      background: var(--card-bg);
      border: 4px solid var(--border);
      width: 100%;
      max-width: 440px;
      padding: 40px 36px;
    }

    /* ── header ── */
    .card-header {
      margin-bottom: 32px;
      border-bottom: 3px solid var(--border);
      padding-bottom: 20px;
    }
    .card-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      color: var(--text);
      line-height: 1.15;
    }
    .card-header p {
      margin-top: 6px;
      font-size: .9rem;
      color: var(--muted);
    }

    /* ── tabs ── */
    .tabs {
      display: flex;
      border: 3px solid var(--border);
      margin-bottom: 28px;
    }
    .tab {
      flex: 1;
      padding: 11px 0;
      background: transparent;
      border: none;
      border-right: 3px solid var(--border);
      color: var(--muted);
      font-family: 'Source Sans 3', sans-serif;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .tab:last-child { border-right: none; }
    .tab.active {
      background: var(--border);
      color: #fdf8f2;
    }
    .tab:not(.active):hover { background: #ede0d0; }

    /* ── forms ── */
    .form { display: none; flex-direction: column; gap: 18px; }
    .form.visible { display: flex; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label {
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--text);
    }

    .input-wrap { position: relative; }
    .input-wrap input {
      width: 100%;
      background: var(--input-bg);
      border: 3px solid var(--border);
      border-radius: 0;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border-color .15s, background .15s;
    }
    .input-wrap input:focus {
      border-color: var(--accent2);
      background: #fff;
    }
    .input-wrap input::placeholder { color: #c4a882; }

    input[type="password"], input[type="text"] { padding-right: 64px; }

    .toggle-pw {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      font-size: .78rem;
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 2px;
      transition: color .15s;
    }
    .toggle-pw:hover { color: var(--accent); }

    .strength-bar {
      height: 4px;
      background: #ddd0c0;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      width: 0%;
      transition: width .3s, background .3s;
    }

    .hint { font-size: .8rem; color: var(--muted); }

    /* ── buttons ── */
    .btn {
      width: 100%;
      padding: 13px;
      border: 3px solid var(--border);
      border-radius: 0;
      font-family: 'Source Sans 3', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn:active { opacity: .85; }
    .btn-primary {
      background: var(--border);
      color: #fdf8f2;
    }
    .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); }
    .btn-primary:disabled {
      opacity: .45; cursor: not-allowed;
    }

    .divider {
      display: flex; align-items: center; gap: 12px;
      color: var(--muted); font-size: .8rem;
      text-transform: uppercase; letter-spacing: .06em;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 2px; background: var(--border);
    }

    .btn-google {
      background: var(--card-bg);
      color: var(--text);
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-google:hover { background: #ede0d0; }

    .forgot {
      text-align: right;
      font-size: .82rem;
    }
    .forgot a {
      color: var(--muted);
      text-decoration: underline;
      transition: color .15s;
    }
    .forgot a:hover { color: var(--accent); }

    /* ── alerts ── */
    .alert {
      padding: 12px 14px;
      border-left: 4px solid;
      font-size: .875rem;
      line-height: 1.5;
      display: none;
    }
    .alert.show { display: block; }
    .alert-error   { background: #fef2f2; border-color: var(--error);   color: var(--error); }
    .alert-success { background: #f0fdf4; border-color: var(--success); color: var(--success); }
    .alert-info    { background: #fef9ec; border-color: var(--accent);  color: var(--accent); }

    /* ── verify screen ── */
    .verify-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      padding: 8px 0;
    }
    .verify-screen.visible { display: flex; }

    .verify-icon {
      width: 68px; height: 68px;
      border: 4px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
    }
    .verify-screen h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--text);
    }
    .verify-screen p {
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.6;
      max-width: 300px;
    }
    .verify-screen .email-highlight { color: var(--accent); font-weight: 600; }

    .resend-row {
      display: flex; align-items: center; gap: 6px;
      font-size: .85rem; color: var(--muted);
    }
    .resend-row button {
      background: none; border: none;
      color: var(--accent); font-family: 'Source Sans 3', sans-serif;
      font-size: .85rem; cursor: pointer; text-decoration: underline; padding: 0;
    }
    .resend-row button:disabled { color: var(--muted); cursor: not-allowed; text-decoration: none; }

    /* ── spinner ── */
    .spinner {
      display: inline-block;
      width: 15px; height: 15px;
      border: 2px solid rgba(253,248,242,.4);
      border-top-color: #fdf8f2;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 500px) {
      .card { padding: 28px 20px; border-width: 3px; }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="card" id="card">
    <div class="card-header">
      <h1>Twoja Aplikacja</h1>
      <p>Zaloguj się lub utwórz nowe konto</p>
    </div>

      <!-- TABS -->
      <div class="tabs" id="tabs">
        <button class="tab active" onclick="switchTab('login')">Logowanie</button>
        <button class="tab" onclick="switchTab('register')">Rejestracja</button>
      </div>

      <!-- ALERT -->
      <div class="alert" id="alert"></div>

      <!-- LOGIN FORM -->
      <div class="form visible" id="loginForm">
        <div class="field">
          <label>Adres e-mail</label>
          <div class="input-wrap">
            <input type="email" id="loginEmail" placeholder="jan@przykład.pl" autocomplete="email" />
          </div>
        </div>
        <div class="field">
          <label>Hasło</label>
          <div class="input-wrap">
            <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
            <button class="toggle-pw" type="button" onclick="togglePw('loginPassword', this)">Pokaż</button>
          </div>
        </div>
        <div class="forgot"><a href="#" onclick="handleForgot(event)">Zapomniałeś hasła?</a></div>
        <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()">Zaloguj się</button>
        <div class="divider">lub</div>
        <button class="btn btn-google" onclick="handleGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Kontynuuj z Google
        </button>
      </div>

      <!-- REGISTER FORM -->
      <div class="form" id="registerForm">
        <div class="field">
          <label>Adres e-mail</label>
          <div class="input-wrap">
            <input type="email" id="regEmail" placeholder="jan@przykład.pl" autocomplete="email" />
          </div>
        </div>
        <div class="field">
          <label>Hasło</label>
          <div class="input-wrap">
            <input type="password" id="regPassword" placeholder="Min. 8 znaków" autocomplete="new-password" oninput="updateStrength(this.value)" />
            <button class="toggle-pw" type="button" onclick="togglePw('regPassword', this)">Pokaż</button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <span class="hint" id="strengthLabel">Siła hasła</span>
        </div>
        <div class="field">
          <label>Potwierdź hasło</label>
          <div class="input-wrap">
            <input type="password" id="regPassword2" placeholder="Powtórz hasło" autocomplete="new-password" />
            <button class="toggle-pw" type="button" onclick="togglePw('regPassword2', this)">Pokaż</button>
          </div>
        </div>
        <button class="btn btn-primary" id="registerBtn" onclick="handleRegister()">Utwórz konto</button>
        <div class="divider">lub</div>
        <button class="btn btn-google" onclick="handleGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Kontynuuj z Google
        </button>
      </div>

      <!-- VERIFY SCREEN -->
      <div class="verify-screen" id="verifyScreen">
        <div class="verify-icon">✉️</div>
        <h2>Sprawdź skrzynkę</h2>
        <p>Wysłaliśmy link weryfikacyjny na adres<br/><span class="email-highlight" id="verifyEmail"></span></p>
        <p style="font-size:.8rem;color:var(--muted)">Kliknij link w e-mailu, aby aktywować konto. Jeśli nie widzisz wiadomości, sprawdź folder Spam.</p>
        <div class="resend-row">
          Nie dostałeś?
          <button id="resendBtn" onclick="resendEmail()">Wyślij ponownie</button>
        </div>
        <button class="btn btn-primary" style="margin-top:8px" onclick="backToLogin()">Wróć do logowania</button>
      </div>

  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp }                        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword,
           signInWithEmailAndPassword, sendEmailVerification,
           sendPasswordResetEmail, GoogleAuthProvider,
           signInWithPopup }                       from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // ─────────────────────────────────────────────
  //  🔧 WKLEJ TUTAJ SWÓJ KONFIG FIREBASE
  // ─────────────────────────────────────────────
  const firebaseConfig = {
    apiKey:            "TWÓJ_API_KEY",
    authDomain:        "TWÓJ_PROJECT.firebaseapp.com",
    projectId:         "TWÓJ_PROJECT_ID",
    storageBucket:     "TWÓJ_PROJECT.appspot.com",
    messagingSenderId: "TWÓJ_SENDER_ID",
    appId:             "TWÓJ_APP_ID"
  };
  // ─────────────────────────────────────────────

  const app      = initializeApp(firebaseConfig);
  const auth     = getAuth(app);
  const gProvider = new GoogleAuthProvider();

  let lastUserForVerify = null;

  // expose to window so onclick handlers can call them
  window._fb = { auth, gProvider, createUserWithEmailAndPassword,
    signInWithEmailAndPassword, sendEmailVerification,
    sendPasswordResetEmail, signInWithPopup, GoogleAuthProvider };

  window.handleLogin = async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pw    = document.getElementById('loginPassword').value;
    if (!email || !pw) return showAlert('Uzupełnij wszystkie pola.', 'error');
    setLoading('loginBtn', true);
    try {
      const cred = await signInWithEmailAndPassword(auth, email, pw);
      if (!cred.user.emailVerified) {
        lastUserForVerify = cred.user;
        showVerify(email);
        return;
      }
      showAlert('Zalogowano! Przekierowanie…', 'success');
      setTimeout(() => { /* window.location.href = '/home.html'; */ }, 1500);
    } catch(e) {
      showAlert(firebaseError(e.code), 'error');
    } finally { setLoading('loginBtn', false); }
  };

  window.handleRegister = async () => {
    const email = document.getElementById('regEmail').value.trim();
    const pw    = document.getElementById('regPassword').value;
    const pw2   = document.getElementById('regPassword2').value;
    if (!email || !pw || !pw2) return showAlert('Uzupełnij wszystkie pola.', 'error');
    if (pw !== pw2) return showAlert('Hasła się nie zgadzają.', 'error');
    if (pw.length < 8) return showAlert('Hasło musi mieć co najmniej 8 znaków.', 'error');
    setLoading('registerBtn', true);
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pw);
      await sendEmailVerification(cred.user);
      lastUserForVerify = cred.user;
      showVerify(email);
    } catch(e) {
      showAlert(firebaseError(e.code), 'error');
    } finally { setLoading('registerBtn', false); }
  };

  window.handleForgot = async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    if (!email) return showAlert('Wpisz adres e-mail, aby zresetować hasło.', 'info');
    try {
      await sendPasswordResetEmail(auth, email);
      showAlert('Link do resetu hasła został wysłany na ' + email, 'success');
    } catch(e) {
      showAlert(firebaseError(e.code), 'error');
    }
  };

  window.handleGoogle = async () => {
    try {
      const cred = await signInWithPopup(auth, gProvider);
      showAlert('Zalogowano przez Google!', 'success');
      setTimeout(() => { /* window.location.href = '/home.html'; */ }, 1200);
    } catch(e) {
      if (e.code !== 'auth/popup-closed-by-user') showAlert(firebaseError(e.code), 'error');
    }
  };

  window.resendEmail = async () => {
    if (!lastUserForVerify) return;
    const btn = document.getElementById('resendBtn');
    btn.disabled = true;
    try {
      await sendEmailVerification(lastUserForVerify);
      showAlert('E-mail wysłany ponownie!', 'success');
    } catch(e) { showAlert('Spróbuj za chwilę.', 'error'); }
    let s = 60;
    const iv = setInterval(() => {
      btn.textContent = `Wyślij ponownie (${--s}s)`;
      if (s <= 0) { clearInterval(iv); btn.textContent = 'Wyślij ponownie'; btn.disabled = false; }
    }, 1000);
  };

  function firebaseError(code) {
    const map = {
      'auth/invalid-email':            'Nieprawidłowy adres e-mail.',
      'auth/user-not-found':           'Nie znaleziono konta z tym adresem.',
      'auth/wrong-password':           'Błędne hasło.',
      'auth/email-already-in-use':     'Ten adres e-mail jest już zajęty.',
      'auth/weak-password':            'Hasło jest za słabe.',
      'auth/too-many-requests':        'Za dużo prób. Spróbuj za chwilę.',
      'auth/network-request-failed':   'Błąd sieci. Sprawdź połączenie.',
      'auth/invalid-credential':       'Nieprawidłowy e-mail lub hasło.',
    };
    return map[code] || 'Wystąpił błąd. Spróbuj ponownie.';
  }
</script>

<script>
  // ── UI helpers ──────────────────────────────

  let activeTab = 'login';

  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach((t,i) =>
      t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register'))
    );
    document.getElementById('loginForm').classList.toggle('visible', tab==='login');
    document.getElementById('registerForm').classList.toggle('visible', tab==='register');
    hideAlert();
  }

  function showAlert(msg, type) {
    const el = document.getElementById('alert');
    el.textContent = msg;
    el.className = 'alert show alert-' + type;
  }
  function hideAlert() {
    document.getElementById('alert').className = 'alert';
  }

  function setLoading(btnId, on) {
    const btn = document.getElementById(btnId);
    btn.disabled = on;
    btn.innerHTML = on
      ? '<span class="spinner"></span>Proszę czekać…'
      : (btnId === 'loginBtn' ? 'Zaloguj się' : 'Utwórz konto');
  }

  function showVerify(email) {
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('loginForm').classList.remove('visible');
    document.getElementById('registerForm').classList.remove('visible');
    document.getElementById('alert').className = 'alert';
    document.getElementById('verifyEmail').textContent = email;
    document.getElementById('verifyScreen').classList.add('visible');
  }

  window.backToLogin = function() {
    document.getElementById('verifyScreen').classList.remove('visible');
    document.getElementById('tabs').style.display = 'flex';
    switchTab('login');
  };

  function togglePw(id, btn) {
    const inp = document.getElementById(id);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.textContent = show ? 'Ukryj' : 'Pokaż';
  }

  function updateStrength(val) {
    const fill  = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    let score = 0;
    if (val.length >= 8)  score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const cfg = [
      { w:'0%',   bg:'transparent', lbl:'Siła hasła' },
      { w:'25%',  bg:'#f87171',     lbl:'Słabe' },
      { w:'50%',  bg:'#fb923c',     lbl:'Średnie' },
      { w:'75%',  bg:'#facc15',     lbl:'Dobre' },
      { w:'100%', bg:'#4ade80',     lbl:'Silne' },
    ];
    fill.style.width      = val ? cfg[score].w  : '0%';
    fill.style.background = cfg[score].bg;
    label.textContent     = val ? cfg[score].lbl : 'Siła hasła';
  }

  // Enter key submit
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (activeTab === 'login' && window.handleLogin)    window.handleLogin();
    if (activeTab === 'register' && window.handleRegister) window.handleRegister();
  });
</script>
</body>
</html>
